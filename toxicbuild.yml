language: python

versions:
  - '3.11'
  - '3.12'
  - '3.13'


system_packages:
  - procps
  - build-essential
  - curl

steps:
  - name: Linter checks
    command: ./scripts/run_linter.sh

  - name: Code complexity checks
    command: xenon toxicbuild -b B

  - name: Unit tests & coverage
    command: ./scripts/check_coverage.sh


builders:
  - name: Docs & Release
    branches:
      - release

    platform: python3.13

    envvars:
      ENV: ci

    plugins:
      - name: apt-install
        packages:
          - build-essential
          - curl

      - name: python-venv
        pyversion: python3.13

    steps:
      - name: Build docs
        command: ./scripts/build_docs.sh
        stop_on_fail: true

      - name: Build package
        command: ./scripts/build_package.sh
        stop_on_fail: true

      - name: upload docs to pdj pypi
        command: ./scripts/upload_to_pdj.sh

      # - name: upload docs to pypi
      #   command: ./scripts/upload_to_pypi.sh

      - name: upload docs
        command: ./scripts/upload_docs.sh
